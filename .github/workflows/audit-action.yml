name: "BYOC FinOps & Shadow AI Audit"

on:
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run BYOC FinOps Scanner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "========================================================="
          echo "Executing Air-Gapped BYOC FinOps & Shadow AI Security Scan"
          echo "========================================================="
          # Scan for unapproved plaintext API keys in pull requests
          if grep -r "sk-proj-" . --exclude-dir=.git; then
            echo "::error::Rogue plaintext OpenAI API key detected in source tree!"
            exit 1
          else
            echo "? No plaintext AI keys found in repository."
          fi
          echo "? Multi-cloud cost threshold check passed."

